server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: GoRouter owns paths like /draft, /standings, /my-team, so any
    # unknown path must serve index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the immutable build assets; never cache the entrypoint.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|wasm|json)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
