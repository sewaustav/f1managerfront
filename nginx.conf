server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: GoRouter owns paths like /draft, /standings, /my-team, so any
    # unknown path must serve index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Flutter web's entrypoints (main.dart.js, flutter_bootstrap.js, flutter.js,
    # version.json, manifest.json, ...) keep a FIXED filename across builds —
    # they are not content-hashed — so a long expires/max-age here means
    # browsers keep executing a stale build indefinitely after a redeploy.
    # Revalidate on every request instead (cheap: nginx answers 304 via
    # ETag/Last-Modified when the file hasn't actually changed).
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|wasm|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
